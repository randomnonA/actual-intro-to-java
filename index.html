<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Tutorial?????</title>
  </head>
  <body>
    <script>
      //Variables / Alerts
      const user = 'Ada Lovelace'
      const text = 'Welcome'
      alert(user)
      alert(text)
      
      //functions
      function square (x) {
        return x * x
      }
      const area = square(5)
      alert(area)
      
      //conditional statements
      let score = 4
      
      if (score > 6) {
        alert ('Good job!')
      }
      else if (score > 3) {
        alert ('Not bad!')
      }
      else {
        alert ('try again!')
      }
      
      // Another conditional statement
      const first = ""
      const second = "hello"
      
      if (first) { 
        alert('hello first!')
      }
      else if (second) { 
        alert('hello second!')
      }
      
      //Loops
      //While loop
      let x = 0

      while (x < 5) {
        x++
      }

      alert('x is now ' + x)
      
      //for loop
      let total = 0

      for (let i = 1; i <= 5; i++) {
        total = total + i
      }

      alert('The total is ' + total)
    </script>
  </body>
</html>
